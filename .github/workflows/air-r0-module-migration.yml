name: air-r0-module-migration

on:
  push:
    branches:
      - feature/20260908-air-r0-core-boundary-consolidation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Rewrite legacy internal module imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '"a2ui/'
          new = '"github.com/Ostrovsky42/agent-interaction-runtime/'
          changed = []
          for path in Path('.').rglob('*.go'):
              if '.git' in path.parts or 'vendor' in path.parts:
                  continue
              text = path.read_text()
              rewritten = text.replace(old, new)
              if rewritten != text:
                  path.write_text(rewritten)
                  changed.append(str(path))
          print(f'rewritten {len(changed)} Go files')
          for path in changed:
              print(path)
          PY
          go mod edit -droprequire=a2ui
          go mod edit -dropreplace=a2ui
          go mod tidy
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
          git diff --check
      - name: Commit canonical imports
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum '*.go' ':/**/*.go'
          git commit -m 'refactor(module): migrate internal imports to canonical AIR path'
          git push origin HEAD:${GITHUB_REF_NAME}
