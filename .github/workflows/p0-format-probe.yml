name: p0-format-probe

on:
  push:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Print exact gofmt diff
        run: |
          gofmt -w agentclient/client_test.go
          git diff -- agentclient/client_test.go
