name: p0-tidy-probe

on:
  push:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Print exact tidy diff
        run: |
          go mod tidy
          git diff -- go.mod go.sum
